name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Built before cargo: the binary embeds web/dist (cross mounts the workspace).
      - run: npm --prefix web ci && npm --prefix web run build
        if: hashFiles('web/package.json') != ''
      - run: cargo install cross --version 0.2.5 --locked
      - run: cross build --release --target aarch64-unknown-linux-gnu --no-default-features --features pi
      - run: cp target/aarch64-unknown-linux-gnu/release/rackscreen rackscreen-aarch64
      # `rackscreen update` verifies the download against this file.
      - run: sha256sum rackscreen-aarch64 > rackscreen-aarch64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rackscreen-aarch64
            rackscreen-aarch64.sha256
            install.sh
