[workspace]
members = ["crates/core", "crates/render", "crates/display", "crates/sources", "crates/app", "crates/ops", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.20.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/silkepilon/RackScreen"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
futures = "0.3"

[package]
name = "rackscreen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Animated Kubernetes rack monitor for four GC9A01 round displays"

[[bin]]
name = "rackscreen"
path = "src/main.rs"

[dependencies]
rackscreen-app = { path = "crates/app" }
rackscreen-ops = { path = "crates/ops", default-features = false }
rackscreen-web = { path = "crates/web" }
rackscreen-sources = { path = "crates/sources" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["user"] }

[features]
default = ["sim", "pi"]
sim = ["rackscreen-app/sim", "rackscreen-ops/sim"]
pi = ["rackscreen-app/pi", "rackscreen-ops/pi"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Everything but the drawing path is network glue that runs a few times a
# minute: optimise it for size. Fewer code pages resident on the Pi, and a
# faster release build.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.rackscreen-core]
opt-level = 3
[profile.release.package.rackscreen-render]
opt-level = 3
[profile.release.package.rackscreen-display]
opt-level = 3
[profile.release.package.rackscreen-app]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.fontdue]
opt-level = 3
[profile.release.package.lz4_flex]
opt-level = 3
[profile.release.package.gif]
opt-level = 3
[profile.release.package.weezl]
opt-level = 3
[profile.release.package.rppal]
opt-level = 3
# The H.264 decoder of the sen role (C++ built by its build script).
[profile.release.package.openh264-sys2]
opt-level = 3
[profile.release.package.rackscreen-sources]
opt-level = "s"
[profile.release.package.rackscreen-web]
opt-level = "s"
[profile.release.package.rackscreen-ops]
opt-level = "s"
