[workspace]
members = ["crates/core", "crates/render", "crates/display", "crates/sources", "crates/app", "crates/setup"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/silkepilon/RackScreen"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
futures = "0.3"

[package]
name = "rackscreen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Animated Kubernetes rack monitor for four GC9A01 round displays"

[[bin]]
name = "rackscreen"
path = "src/main.rs"

[dependencies]
rackscreen-app = { path = "crates/app" }
rackscreen-setup = { path = "crates/setup", default-features = false }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["user"] }

[features]
default = ["sim", "pi"]
sim = ["rackscreen-app/sim", "rackscreen-setup/sim"]
pi = ["rackscreen-app/pi", "rackscreen-setup/pi"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
