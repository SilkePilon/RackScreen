[package]
name = "rackscreen-sources"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rackscreen-core = { path = "../core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
futures.workspace = true
fastrand = "2"
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28", features = ["v1_33"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
urlencoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "charset", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
sgp4 = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
