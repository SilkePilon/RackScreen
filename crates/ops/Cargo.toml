[package]
name = "rackscreen-ops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rackscreen-app = { path = "../app", default-features = false }
rackscreen-core = { path = "../core" }
anyhow.workspace = true
tracing.workspace = true
nix = { version = "0.31", features = ["user", "fs"] }
sha2 = "0.11"
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "blocking", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"

[dev-dependencies]

[features]
default = []
sim = ["rackscreen-app/sim"]
pi = ["rackscreen-app/pi"]
