[package]
name = "rackscreen-web"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
rackscreen-app = { path = "../app", default-features = false }
rackscreen-core = { path = "../core" }
rackscreen-sources = { path = "../sources" }
rackscreen-ops = { path = "../ops", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing.workspace = true
futures.workspace = true
axum = { version = "0.8", features = ["ws", "json", "http1", "tokio", "macros"] }
include_dir = "0.7"
mime_guess = "2"
png = "0.18"
getrandom = "0.3"
subtle = "2"
hex = "0.4"
nix = { version = "0.31", features = ["user", "fs", "net", "hostname"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
http-body-util = "0.1"

[features]
default = []
