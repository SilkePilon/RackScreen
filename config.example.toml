# RackScreen configuration. Copy to ~/.config/rackscreen/config.toml on the Pi.

[k8s]
kubeconfig = "~/k8s-monitor.yaml"

[prometheus]
namespace = "monitoring"
service = "auto"        # "auto" picks the first service containing "prometheus" that exposes `port`
port = 9090
poll_secs = 5
ignore_alerts = ["Watchdog", "InfoInhibitor"]   # always-firing alerts that must not turn HEALTH red

[qbittorrent]
enabled = true
namespace = "arr-stack"
service = "qbittorrent"
port = 8080
user = ""               # empty = rely on "bypass auth for localhost"
pass = ""
poll_secs = 3

[night]
enabled = true
start = "23:00"
end = "07:00"

[thresholds]
hot_cpu = 90
hot_mem = 90

[display]
brightness = 1.0
fps = 30
spi_chunk = 4096        # raise to 65536 after adding spidev.bufsiz=65536 to cmdline.txt

[[screens]]
role = "cpu"
spi = 0
cs = 0
dc = 6
rst = 5
rotate = 270
hflip = false
hz = 40000000

[[screens]]
role = "mem"
spi = 0
cs = 1
dc = 13
rst = 26
rotate = 270
hflip = true
hz = 40000000

[[screens]]
role = "pods"
spi = 1
cs = 0
dc = 23
rst = 22
rotate = 270
hflip = true
hz = 16000000

[[screens]]
role = "health"
spi = 1
cs = 1
dc = 4
rst = 27
rotate = 270
hflip = true
hz = 16000000
